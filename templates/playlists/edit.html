{% extends "base.html" %}
{% block title %}Edit Playlist{% endblock %}
{% block content %}
<h2>Edit Playlist</h2>
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label for="name">Name</label>
        <input type="text" name="name" id="name" class="form-control" value="{{ playlist.name }}" required>
    </div>
    <div class="mb-3">
        <label for="is_public">Public?</label>
        <input type="checkbox" name="is_public" id="is_public" {% if playlist.is_public %}checked{% endif %}>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
</form>
{% endblock %}
