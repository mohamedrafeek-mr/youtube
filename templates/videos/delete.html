{% extends "base.html" %}
{% block title %}Delete Video{% endblock %}
{% block content %}
<div class="card bg-dark text-white p-4 mb-4">
  <h2>Delete Video</h2>
  <p>Are you sure you want to delete "{{ video.title }}"?</p>
  <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Delete</button>
      <a href="{% url 'users:channel' request.user.username %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
